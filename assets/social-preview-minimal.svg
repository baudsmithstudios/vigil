<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <style>
      @font-face {
        font-family: 'Cinzel';
        src: url('data:font/truetype;base64,') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="#0C1117"/>

  <!-- corner tick marks -->
  <line x1="24" y1="24" x2="56" y2="24" stroke="#005f5f" stroke-width="1.5"/>
  <line x1="24" y1="24" x2="24" y2="56" stroke="#005f5f" stroke-width="1.5"/>
  <line x1="1224" y1="24" x2="1256" y2="24" stroke="#005f5f" stroke-width="1.5"/>
  <line x1="1256" y1="24" x2="1256" y2="56" stroke="#005f5f" stroke-width="1.5"/>
  <line x1="24" y1="616" x2="56" y2="616" stroke="#005f5f" stroke-width="1.5"/>
  <line x1="24" y1="584" x2="24" y2="616" stroke="#005f5f" stroke-width="1.5"/>
  <line x1="1224" y1="616" x2="1256" y2="616" stroke="#005f5f" stroke-width="1.5"/>
  <line x1="1256" y1="584" x2="1256" y2="616" stroke="#005f5f" stroke-width="1.5"/>

  <!-- flanking rules with end brackets -->
  <line x1="72" y1="300" x2="420" y2="300" stroke="#005f5f" stroke-width="1.5"/>
  <line x1="420" y1="288" x2="420" y2="312" stroke="#005f5f" stroke-width="1.5"/>
  <line x1="860" y1="300" x2="1208" y2="300" stroke="#005f5f" stroke-width="1.5"/>
  <line x1="860" y1="288" x2="860" y2="312" stroke="#005f5f" stroke-width="1.5"/>

  <!-- title -->
  <text
    x="640"
    y="300"
    font-family="Cinzel, serif"
    font-size="96"
    font-weight="400"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="20"
    fill="#5faf87"
  >VIGIL</text>

  <!-- tagline -->
  <text
    x="640"
    y="385"
    font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace"
    font-size="20"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#8b949e"
    letter-spacing="1"
  >A single binary that watches your Pi around the clock. No stack, no agents, no noise.</text>
</svg>
